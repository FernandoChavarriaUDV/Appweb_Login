<form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm">
  <mat-card>
    <mat-card-title>Iniciar sesión</mat-card-title>
    <mat-card-content>
      <mat-form-field appearance="fill">
        <mat-label>Usuario</mat-label>
        <input matInput placeholder="Ingresa tu usuario" [(ngModel)]="username" name="username" required #usuario="ngModel">
        <mat-error *ngIf="usuario.invalid && usuario.touched">
          El usuario es obligatorio
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" placeholder="Ingresa tu contraseña" [(ngModel)]="password" name="password" required #contrasena="ngModel">
        <mat-error *ngIf="contrasena.invalid && contrasena.touched">
          La contraseña es obligatoria
        </mat-error>
      </mat-form-field>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">
        Entrar
      </button>
    </mat-card-actions>
  </mat-card>
</form>
